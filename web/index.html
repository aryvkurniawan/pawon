<!doctype html>
<html lang="id" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawon · Dashboard</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/app.js" defer></script>
</head>
<body class="min-h-full bg-slate-950 text-slate-200" data-page="dashboard">
<nav class="border-b border-slate-800 bg-slate-900/60">
  <div class="mx-auto flex max-w-5xl items-center gap-6 px-4 py-3">
    <a href="/" class="text-lg font-bold tracking-tight text-emerald-400">Pawon</a>
    <a href="/" data-nav="dashboard" class="text-sm">Dashboard</a>
    <a href="/sites.html" data-nav="sites" class="text-sm">Sites</a>
    <a href="/tunnel.html" data-nav="tunnel" class="text-sm">Tunnel</a>
    <a href="/settings.html" data-nav="settings" class="text-sm">Pengaturan</a>
  </div>
</nav>
<main class="mx-auto max-w-5xl space-y-6 px-4 py-6">
  <section class="grid gap-4 sm:grid-cols-3">
    <div class="rounded-xl border border-slate-800 bg-slate-900 p-4">
      <h2 class="text-sm text-slate-400">Site terdaftar</h2>
      <p id="sum-sites" class="mt-1 text-2xl font-bold text-white">&ndash;</p>
    </div>
    <div class="rounded-xl border border-slate-800 bg-slate-900 p-4 sm:col-span-2">
      <h2 class="text-sm text-slate-400">Cloudflare Tunnel</h2>
      <p id="sum-tunnel" class="mt-2 text-sm">&ndash;</p>
    </div>
  </section>

  <section>
    <h2 class="mb-3 text-sm font-semibold uppercase tracking-wide text-slate-400">Layanan</h2>
    <div id="services" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></div>
  </section>

  <section id="logs" class="rounded-xl border border-slate-800 bg-slate-900 p-4">
    <div class="mb-3 flex flex-wrap items-center gap-2">
      <h2 class="mr-2 text-sm font-semibold uppercase tracking-wide text-slate-400">Log</h2>
      <select id="log-source" class="rounded-lg border border-slate-700 bg-slate-950 px-2 py-1.5 text-sm text-slate-200"></select>
      <select id="log-tail" class="rounded-lg border border-slate-700 bg-slate-950 px-2 py-1.5 text-sm text-slate-200">
        <option value="100">100 baris</option>
        <option value="200" selected>200 baris</option>
        <option value="500">500 baris</option>
        <option value="1000">1000 baris</option>
      </select>
      <span id="log-meta" class="text-xs text-slate-500"></span>
      <span class="ml-auto flex gap-2">
        <button id="log-refresh" class="rounded-lg border border-slate-600 px-3 py-1.5 text-xs font-medium text-slate-200 hover:bg-slate-800">Refresh</button>
        <button id="log-pause" class="rounded-lg border border-slate-600 px-3 py-1.5 text-xs font-medium text-slate-200 hover:bg-slate-800">Berhenti</button>
      </span>
    </div>
    <pre id="log-output" class="max-h-96 overflow-auto rounded-lg bg-slate-950 p-3 font-mono text-xs leading-relaxed text-slate-300">(memuat&hellip;)</pre>
  </section>
</main>
<div id="toasts" class="fixed bottom-4 right-4 z-50 space-y-2"></div>
</body>
</html>
