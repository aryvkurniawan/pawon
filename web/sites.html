<!doctype html>
<html lang="id" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawon · Sites</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/app.js" defer></script>
</head>
<body class="min-h-full bg-slate-950 text-slate-200" data-page="sites">
<nav class="border-b border-slate-800 bg-slate-900/60">
  <div class="mx-auto flex max-w-5xl items-center gap-6 px-4 py-3">
    <a href="/" class="text-lg font-bold tracking-tight text-emerald-400">Pawon</a>
    <a href="/" data-nav="dashboard" class="text-sm">Dashboard</a>
    <a href="/sites.html" data-nav="sites" class="text-sm">Sites</a>
    <a href="/tunnel.html" data-nav="tunnel" class="text-sm">Tunnel</a>
    <a href="/settings.html" data-nav="settings" class="text-sm">Pengaturan</a>
  </div>
</nav>
<main class="mx-auto max-w-5xl space-y-6 px-4 py-6">

  <section class="rounded-xl border border-slate-800 bg-slate-900 p-4">
    <h2 class="mb-3 font-semibold text-white">Tambah Site</h2>
    <form id="site-form" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-6">
      <label class="text-xs text-slate-400 lg:col-span-2">Subdomain
        <input id="f-sub" required pattern="[a-z0-9]([a-z0-9-]*[a-z0-9])?" placeholder="app"
          class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100">
      </label>
      <label class="text-xs text-slate-400 lg:col-span-2">Zone (domain)
        <select id="f-zone" required class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100"></select>
      </label>
      <label class="text-xs text-slate-400 lg:col-span-2">Folder root
        <input id="f-root" required placeholder="C:/pawon/sites/app"
          class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100">
      </label>
      <label class="text-xs text-slate-400">Tipe
        <select id="f-type" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100">
          <option value="php">PHP</option>
          <option value="laravel">Laravel</option>
        </select>
      </label>
      <label class="text-xs text-slate-400">Versi PHP
        <select id="f-php" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100"></select>
      </label>
      <label class="flex items-center gap-2 self-end text-sm text-slate-300">
        <input id="f-db" type="checkbox" class="size-4 rounded border-slate-600 bg-slate-950"> Buat database
      </label>
      <button type="submit" class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-500 lg:col-span-2">
        Tambah Site
      </button>
    </form>
  </section>

  <section class="rounded-xl border border-slate-800 bg-slate-900">
    <table class="w-full text-left text-sm">
      <thead>
        <tr class="text-xs uppercase tracking-wide text-slate-500">
          <th class="px-3 py-2">Hostname</th>
          <th class="px-3 py-2">Tipe</th>
          <th class="px-3 py-2">PHP</th>
          <th class="px-3 py-2">Database</th>
          <th class="px-3 py-2">Status</th>
          <th class="px-3 py-2 text-right">Aksi</th>
        </tr>
      </thead>
      <tbody id="sites-body"></tbody>
    </table>
  </section>
</main>

<!-- Modal .env -->
<div id="modal" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/60 p-4">
  <div class="w-full max-w-2xl rounded-xl border border-slate-700 bg-slate-900 p-4">
    <div class="mb-3 flex items-center justify-between">
      <h3 class="font-semibold text-white">Edit .env <span id="env-host" class="text-sm text-slate-400"></span></h3>
      <button id="env-close" class="rounded-lg border border-slate-600 px-3 py-1.5 text-xs text-slate-300 hover:bg-slate-800">Tutup</button>
    </div>
    <textarea id="env-text" rows="16" spellcheck="false"
      class="w-full rounded-lg border border-slate-700 bg-slate-950 p-3 font-mono text-sm text-slate-200"></textarea>
    <div class="mt-3 flex justify-end">
      <button id="env-save" class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-500">Simpan</button>
    </div>
  </div>
</div>
<div id="toasts" class="fixed bottom-4 right-4 z-50 space-y-2"></div>
</body>
</html>
