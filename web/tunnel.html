<!doctype html>
<html lang="id" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawon · Tunnel</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/app.js" defer></script>
</head>
<body class="min-h-full bg-slate-950 text-slate-200" data-page="tunnel">
<nav class="border-b border-slate-800 bg-slate-900/60">
  <div class="mx-auto flex max-w-5xl items-center gap-6 px-4 py-3">
    <a href="/" class="text-lg font-bold tracking-tight text-emerald-400">Pawon</a>
    <a href="/" data-nav="dashboard" class="text-sm">Dashboard</a>
    <a href="/sites.html" data-nav="sites" class="text-sm">Sites</a>
    <a href="/tunnel.html" data-nav="tunnel" class="text-sm">Tunnel</a>
    <a href="/settings.html" data-nav="settings" class="text-sm">Pengaturan</a>
  </div>
</nav>
<main class="mx-auto max-w-5xl space-y-6 px-4 py-6">

  <section class="rounded-xl border border-slate-800 bg-slate-900 p-4">
    <div class="mb-3 flex items-center justify-between">
      <h2 class="font-semibold text-white">Status Konektor</h2>
      <button id="t-refresh" class="rounded-lg border border-slate-600 px-3 py-1.5 text-xs font-medium text-slate-200 hover:bg-slate-800">Refresh</button>
    </div>
    <div id="tunnel-status" class="text-sm text-slate-400">&ndash;</div>
  </section>

  <section class="rounded-xl border border-slate-800 bg-slate-900 p-4">
    <h2 class="mb-1 font-semibold text-white">Setup Tunnel</h2>
    <p class="mb-3 text-sm text-slate-400">Paste Cloudflare API token (akun pertama dipakai; zone diambil otomatis, tunnel bernama <code class="text-emerald-400">pawon</code> dibuat bila belum ada).</p>
    <form id="tunnel-form" class="flex flex-wrap items-end gap-3">
      <label class="min-w-72 flex-1 text-xs text-slate-400">API Token
        <input id="t-token" type="password" required placeholder="Cloudflare API Token"
          class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 font-mono text-sm text-slate-100">
      </label>
      <button type="submit" class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-500">Setup</button>
    </form>
  </section>
</main>
<div id="toasts" class="fixed bottom-4 right-4 z-50 space-y-2"></div>
</body>
</html>
